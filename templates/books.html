<!DOCTYPE html>
<html>

<head>

    <title>My Library</title>

    <style>

        body {
            background-color: #f7f7f7;
            font-family: sans-serif;
        }

        #books-grid {
            background: white;
            width: 1030px;

            border: 1px solid #e3e3e3;
            border-radius: 10px;

            padding: 20px;
            margin: 0 auto;
        }

        img {
            box-shadow: 1px 2px 5px 0 #c3b683;
            border-radius: 10px;

            height: 200px;
            width: 128px;
            object-fit: cover;

            margin-bottom: 30px;
        }

        h3 {
            color: #006595;
            font-size: 18px;

            margin-bottom: 10px;
            margin-top: 0;
        }

        p {
            margin: 2px;
        }

        .book-text-container {
            display: inline-block;
            vertical-align: top;
            width: 200px;
        }

    </style>

</head>

<body>

    <div id="books-grid">

        {% for book in books %}

            {% if book['cover'] == '' %}

                <img
                    src="/static/covers/book-cover-placeholder.jpg"
                    alt="{{ book['title'] }} cover">

            {% else %}

                <img
                    src="/static/covers/{{ book['cover'] }}"
                    alt="{{ book['title'] }} cover">

            {% endif %}

            <div class="book-text-container">
                <h3>{{ book['title'] }}</h3>
                <p>{{ book['author'] }}</p>
                <p>{{ book['published'] }}</p>
                <p>{{ book['genre'] }}</p>
            </div>

        {% endfor %}

    </div>

</body>

</html>
